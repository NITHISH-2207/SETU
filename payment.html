<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SETU - Funding Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --teal:#0f6857; --orange:#e2793f; --bg:#f7f4ee; --surface:#fff; --text:#141d1a; --soft:#5c655f; --line:#d8d2c3; --input:#fff; }
    body.dark { --bg:#101815; --surface:#18231e; --text:#edf3ef; --soft:#a8b8af; --line:#34473d; --input:#111b17; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px Outfit,sans-serif; transition:background .25s,color .25s; }
    .theme-toggle { position:fixed; top:20px; right:20px; display:grid; place-items:center; width:64px; height:34px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--teal); cursor:pointer; font-size:1rem; box-shadow:0 4px 14px #141d1a18; transition:background .25s,border-color .25s,transform .2s; }
    .theme-toggle:hover { transform:translateY(-2px); border-color:var(--teal); }
    .theme-toggle:focus-visible { outline:3px solid #e2793f66; outline-offset:3px; }
    body.dark .theme-toggle { background:var(--teal); color:#fff; border-color:var(--teal); }
    .card { width:min(100%,460px); padding:36px; border:1px solid var(--line); border-radius:12px; background:var(--surface); box-shadow:0 16px 36px #141d1a14; }
    body.dark .card { box-shadow:0 16px 36px #00000040; }
    h1 { margin:10px 0 0; font:700 1.5rem Syne,sans-serif; line-height:1.25; }
    .tag { color:var(--orange); font:700 .72rem 'Space Mono',monospace; letter-spacing:.08em; }
    .back { display:inline-block; margin-bottom:30px; color:var(--teal); font-weight:600; text-decoration:none; }
    .id { margin-top:7px; color:var(--soft); font-size:.8rem; }
    .progress { margin-top:25px; height:8px; overflow:hidden; border-radius:4px; background:var(--line); }
    .fill { height:100%; background:var(--orange); }
    .figures { display:flex; justify-content:space-between; margin-top:8px; color:var(--soft); font-size:.82rem; }
    .figures strong { color:var(--teal); }
    .form { margin-top:24px; padding-top:20px; border-top:1px dashed var(--line); }
    label { display:block; margin:14px 0 6px; color:var(--soft); font-size:.82rem; }
    input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:6px; background:var(--input); color:var(--text); font:inherit; }
    .btn { width:100%; margin-top:20px; padding:14px; border:0; border-radius:6px; background:var(--teal); color:#fff; cursor:pointer; font:600 .95rem Outfit,sans-serif; }
    .note { margin:14px 0 0; color:var(--soft); text-align:center; font-size:.76rem; }
    @media (max-width:500px) { .card { padding:26px; } }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Switch theme">☾</button>
  <main class="card">
    <a class="back" href="setu-tata-csr-profile.html">&larr; Tata CSR Profile</a>
    <span class="tag">FUNDING CHECKOUT</span>
    <h1 id="challengeTitle">Fund This Challenge</h1>
    <div class="id">ID: <span id="challengeId">-</span></div>
    <div class="progress"><div class="fill" id="fillBar"></div></div>
    <div class="figures"><strong id="raisedFig">₹0 raised</strong><span id="requiredFig">of ₹0</span></div>
    <form class="form" id="paymentForm">
      <label for="amount">Amount to contribute (₹)</label>
      <input id="amount" type="number" min="1" required placeholder="50000">
      <label for="organisation">Organisation</label>
      <input id="organisation" value="Tata Group">
      <button class="btn" type="submit">Proceed to pay &rarr;</button>
    </form>
    <p class="note">Frontend placeholder - payment gateway integration happens on the backend.</p>
  </main>
  <script>
    const savedTheme = localStorage.getItem('setu-theme');
    const themeToggle = document.getElementById('themeToggle');
    const applyTheme = (isDark) => {
      document.body.classList.toggle('dark', isDark);
      themeToggle.textContent = isDark ? '☀' : '☾';
      themeToggle.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
    };
    applyTheme(savedTheme === 'dark');
    themeToggle.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('dark');
      localStorage.setItem('setu-theme', isDark ? 'dark' : 'light');
      applyTheme(isDark);
    });
    const params = new URLSearchParams(location.search);
    const title = params.get('title') || 'Community Challenge';
    const id = params.get('id') || '-';
    const required = Number(params.get('required') || 500000);
    const raised = Number(params.get('raised') || 0);
    document.getElementById('challengeTitle').textContent = 'Fund: ' + title;
    document.getElementById('challengeId').textContent = id;
    document.getElementById('raisedFig').textContent = '₹' + raised.toLocaleString('en-IN') + ' raised';
    document.getElementById('requiredFig').textContent = 'of ₹' + required.toLocaleString('en-IN');
    document.getElementById('fillBar').style.width = Math.min(100, Math.round(raised / required * 100)) + '%';
    document.getElementById('amount').placeholder = Math.max(required - raised, 0);
    document.getElementById('paymentForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const nextParams = new URLSearchParams(params);
      nextParams.set('amount', document.getElementById('amount').value || document.getElementById('amount').placeholder);
      window.location.href = 'payment-options.html?' + nextParams.toString();
    });
  </script>
</body>
</html>
